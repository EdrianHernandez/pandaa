<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Ears -->
  <circle cx="14" cy="14" r="10" fill="#1a1a1a"/>
  <circle cx="50" cy="14" r="10" fill="#1a1a1a"/>
  <!-- Face -->
  <circle cx="32" cy="34" r="24" fill="white"/>
  <!-- Eye patches -->
  <ellipse cx="22" cy="30" rx="8" ry="9" fill="#1a1a1a" transform="rotate(-10 22 30)"/>
  <ellipse cx="42" cy="30" rx="8" ry="9" fill="#1a1a1a" transform="rotate(10 42 30)"/>
  <!-- Eyes -->
  <circle cx="22" cy="30" r="3.5" fill="white"/>
  <circle cx="42" cy="30" r="3.5" fill="white"/>
  <circle cx="23" cy="29" r="1.5" fill="#1a1a1a"/>
  <circle cx="43" cy="29" r="1.5" fill="#1a1a1a"/>
  <!-- Nose -->
  <ellipse cx="32" cy="38" rx="3" ry="2" fill="#1a1a1a"/>
  <!-- Mouth -->
  <path d="M29 41 Q32 44 35 41" stroke="#1a1a1a" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Blush -->
  <circle cx="16" cy="38" r="3.5" fill="#f8bbd0" opacity="0.5"/>
  <circle cx="48" cy="38" r="3.5" fill="#f8bbd0" opacity="0.5"/>
</svg>
